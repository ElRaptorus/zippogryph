name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish?'
        type: boolean
        default: false
      dry_run:
        description: 'Dry Run?'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Format and Test (NodeJS v${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24', '26']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: npm

      - name: Install NPM v12
        run: npm i -g npm@12

      - name: Install
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  publish:
    name: Publish to ${{ matrix.name }}
    needs: quality
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: NPM
            registry: https://registry.npmjs.org
            secret: NPM_TOKEN
          - name: GitHub
            registry: https://npm.pkg.github.com
            secret: GH_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true
          cache: npm
          registry-url: ${{ matrix.registry }}
          scope: '@elraptorus'

      - name: Install NPM v12
        run: npm i -g npm@12

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Point @elraptorus at GitHub Packages
        if: matrix.name == 'GitHub'
        run: |
          printf '%s\n' \
            '@elraptorus:registry=https://npm.pkg.github.com' \
            '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' \
            > .npmrc

      - name: Publish (Dry Run)
        if: inputs.dry_run
        env:
          NODE_AUTH_TOKEN: ${{ secrets[matrix.secret] }}
        run: npm publish --dry-run --access public --registry ${{ matrix.registry }}

      - name: Publish (For real)
        if: inputs.dry_run == false
        env:
          NODE_AUTH_TOKEN: ${{ secrets[matrix.secret] }}
        run: npm publish --access public --registry ${{ matrix.registry }}
